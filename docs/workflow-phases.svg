<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="200" fill="#ffffff"/>

  <text x="360" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#333">AI-Assisted Development Workflow</text>

  <!-- Phase 1: Clarify -->
  <rect x="10" y="40" width="120" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="70" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">1. Clarify</text>
  <text x="70" y="76" text-anchor="middle" font-size="10" fill="#0F6E56">Understand scope</text>

  <line x1="130" y1="65" x2="148" y2="65" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Phase 2: Design -->
  <rect x="150" y="40" width="120" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="210" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">2. Design</text>
  <text x="210" y="76" text-anchor="middle" font-size="10" fill="#534AB7">Choose approach</text>

  <line x1="270" y1="65" x2="288" y2="65" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Phase 3: Plan -->
  <rect x="290" y="40" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="350" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">3. Plan</text>
  <text x="350" y="76" text-anchor="middle" font-size="10" fill="#185FA5">Break into tasks</text>

  <line x1="410" y1="65" x2="428" y2="65" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Phase 4: Code -->
  <rect x="430" y="40" width="120" height="50" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="490" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">4. Code</text>
  <text x="490" y="76" text-anchor="middle" font-size="10" fill="#BA7517">Implement + test</text>

  <line x1="550" y1="65" x2="568" y2="65" stroke="#888780" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Phase 5: Verify -->
  <rect x="570" y="40" width="140" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="640" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">5. Verify</text>
  <text x="640" y="76" text-anchor="middle" font-size="10" fill="#0F6E56">Review + ship</text>

  <!-- Cost label -->
  <rect x="10" y="105" width="400" height="24" rx="4" fill="#F0F0EC"/>
  <text x="210" y="121" text-anchor="middle" font-size="11" fill="#5F5E5A">Phases 1-3: Low cost (text planning only)</text>

  <rect x="430" y="105" width="280" height="24" rx="4" fill="#FFF3E0"/>
  <text x="570" y="121" text-anchor="middle" font-size="11" fill="#BA7517">Phases 4-5: High cost (writing code)</text>

  <!-- Quality gates -->
  <text x="360" y="150" text-anchor="middle" font-size="12" font-weight="500" fill="#333">Quality gates between each phase</text>

  <!-- File update timing -->
  <rect x="10" y="165" width="700" height="28" rx="4" fill="#F7F7F5"/>
  <text x="20" y="183" font-size="11" fill="#5F5E5A">BACKLOG.md: update immediately when tasks change</text>
  <text x="330" y="183" font-size="11" fill="#5F5E5A">MEMORY.md: update on decisions</text>
  <text x="560" y="183" font-size="11" fill="#5F5E5A">SESSION.md: milestones + end</text>
</svg>
